<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1260" viewBox="0 0 2100 1260">
<title>Auction System — Final ER Diagram</title>
<desc>Entity relationship diagram for the COMP0178 auction project, showing entities, keys, assumptions, and relationship cardinalities.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172334} .title{font-size:34px;font-weight:700} .sub{font-size:15px;fill:#344256}
.box{fill:#fff;stroke:#45566d;stroke-width:2} .head{stroke:#45566d;stroke-width:2} .ht{font-size:21px;font-weight:700}
.attr{font-size:17px} .line{fill:none;stroke:#52667f;stroke-width:2.5} .rel{font-size:15px;font-weight:600} .card{font-size:14px;font-weight:700}
.note{fill:#edf2f7;stroke:#c4ceda;stroke-width:1.5} .nt{font-size:14px} .legend{font-size:14px;fill:#475569}
</style>
<text x="1050" y="45" text-anchor="middle" class="title">Auction System — Final ER Diagram</text>
<text x="1050" y="75" text-anchor="middle" class="sub">Role assumption: a user must be a Buyer, a Seller, or both; roles may overlap.</text>
<text x="1050" y="99" text-anchor="middle" class="sub">A category may have no auctions. A sold auction has one SaleOrder and one winning Bid from that auction. Payment processing is out of scope.</text>

