<rect x="50" y="1090" width="1990" height="108" rx="10" class="note"/>
<text x="75" y="1120" class="nt"><tspan font-weight="700">Notes:</tspan> Each auction belongs to exactly one category; a category may currently have zero auctions.</text>
<text x="75" y="1145" class="nt">Only a sold auction has a SaleOrder. Its winning Bid must belong to that same auction; use a composite constraint to enforce this.</text>
<text x="75" y="1170" class="nt">Payment is excluded because the core brief does not require it. Recommendations can be calculated from bid history; confirm assumptions with your group.</text>
<text x="50" y="1230" class="legend">PK = primary key · FK = foreign key · 1 = exactly one · 0..1 = optional, at most one · 0..* = zero or many</text>
